name: Update Cask

on:
  repository_dispatch:
    types: [update-cask]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without v prefix)"
        required: true
      sha256:
        description: "SHA256 of the zip"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
      SHA256: ${{ github.event.inputs.sha256 || github.event.client_payload.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          if ! echo "$SHA256" | grep -qE '^[a-f0-9]{64}$'; then
            echo "Invalid sha256 format: $SHA256"
            exit 1
          fi

      - name: Update Cask
        run: |
          sed -i "s/version \".*\"/version \"$VERSION\"/" Casks/menu-bar-nape-pro-status.rb
          sed -i "s/sha256 .*/sha256 \"$SHA256\"/" Casks/menu-bar-nape-pro-status.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/menu-bar-nape-pro-status.rb
          git commit -m "Update menu-bar-nape-pro-status to $VERSION"
          git push
