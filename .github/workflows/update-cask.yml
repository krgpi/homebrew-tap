name: Update Cask

on:
  repository_dispatch:
    types: [update-cask]
  workflow_dispatch:
    inputs:
      cask:
        description: "Cask name (e.g. fennec)"
        required: true
      version:
        description: "Version (without v prefix)"
        required: true
      sha256:
        description: "SHA256 of the archive"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CASK: ${{ github.event.inputs.cask || github.event.client_payload.cask }}
      VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
      SHA256: ${{ github.event.inputs.sha256 || github.event.client_payload.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if ! echo "$CASK" | grep -qE '^[a-z0-9-]+$'; then
            echo "Invalid cask name: $CASK"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          if ! echo "$SHA256" | grep -qE '^[a-f0-9]{64}$'; then
            echo "Invalid sha256 format: $SHA256"
            exit 1
          fi
          if [ ! -f "Casks/${CASK}.rb" ]; then
            echo "Cask file not found: Casks/${CASK}.rb"
            exit 1
          fi

      - name: Update Cask
        run: |
          sed -i "s/version \".*\"/version \"$VERSION\"/" "Casks/${CASK}.rb"
          sed -i "s/sha256 .*/sha256 \"$SHA256\"/" "Casks/${CASK}.rb"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          git commit -m "Update ${CASK} to ${VERSION}"
          git push
